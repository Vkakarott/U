included:
  - Sources
  - Tests

disabled_rules:
  # Terminal output is not guaranteed to be valid UTF-8; lossy decoding is intended.
  - optional_data_string_conversion

excluded:
  - .build

line_length:
  warning: 120
  error: 140

identifier_name:
  min_length:
    warning: 2

trailing_whitespace:
  ignores_empty_lines: true

# swift-format adds trailing commas to multi-line collections; keep both tools in agreement.
trailing_comma:
  mandatory_comma: true

# A flat switch over message kinds is not complex code.
cyclomatic_complexity:
  ignores_case_statements: true

custom_rules:
  no_print:
    name: "No print in production code"
    included: "Sources/.*\\.swift"
    regex: "\\b(print|debugPrint|NSLog)\\s*\\("
    match_kinds:
      - identifier
    message: "Use Logger instead of print."
    severity: error
